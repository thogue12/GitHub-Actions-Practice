name: Add new entry to Manifest file for SQL Scripts

on:
  workflow_dispatch:
    inputs:
      scriptName:
        description: 'Name of the SQL script in the SqlScripts folder e.g. sales-force.sql'
        required: true
        type: string
      db_pattern:
        description: 'DBName patterns comma-separated e.g. *SiteName*,*SiteNames*,*SiteName3*: defaults to all databases'
        required: true
        default: ''
        type: string
      version_pattern:
        description: 'Version pattern e.g. 812* — leave blank to run for all VERSION'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  id-token: write

defaults:
  run:
    working-directory: SQLScripts ## subject to change


jobs:
  scriptCheck:
    name: Check Script Exists
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Get manifest file
        id: manifest_file
        run: |
          if [ -f "manifest.json" ]; then
            echo "manifest_exists=true" >> $GITHUB_OUTPUT
          else
            echo "manifest_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate script name is a .sql file
        run: |
          if [[ "${{ github.event.inputs.scriptName }}" != *.sql ]]; then
            echo "ERROR: scriptName must be a .sql file, got: ${{ github.event.inputs.scriptName }}"
            exit 1
          fi

      - name: Check script exists in SqlScripts folder
        run: |
          if [ ! -f "${{ github.event.inputs.scriptName }}" ]; then
            echo "ERROR: ${{ github.event.inputs.scriptName }} not found in SqlScripts folder"
            echo "Make sure your PR adding the script was merged to main before running this workflow"
            exit 1
          fi
          echo "OK: ${{ github.event.inputs.scriptName }} found"

      - name: Check DB pattern is not empty
        run: |
          if [[ -z "${{ github.event.inputs.db_pattern }}" ]]; then
            echo "ERROR: input for parameter 'db_pattern' is empty"
            exit 1
          fi

  parseManifest:
    name: parse manifest
    needs: scriptCheck
    runs-on: ubuntu-latest
  
    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Read Manifest File
      id: read_manifest
      run: |
        ENTRY_COUNT=$(jq 'length' manifest.json)
        echo "Manifest has $ENTRY_COUNT entries"

    - name: Check for duplicates
      id: check_duplicates
      run: |
        DB_ARRAY=$(echo "${{ github.event.inputs.db_pattern }}" | jq -R 'split(",")')

        if [[ -n "${{ github.event.inputs.version_pattern }}" ]]; then
          VERSION_ARRAY=$(echo "${{ github.event.inputs.version_pattern }}" | jq -R 'split(",")')
          NEW_CONDITIONS=$(jq -n --argjson db "$DB_ARRAY" --argjson vp "$VERSION_ARRAY" \
            '[{"field": "DBName", "pattern": $db}, {"field": "Version", "pattern": $vp}]')
        else
          NEW_CONDITIONS=$(jq -n --argjson db "$DB_ARRAY" \
            '[{"field": "DBName", "pattern": $db}]')
        fi

        DUPLICATE=$(jq --arg script "${{ github.event.inputs.scriptName }}" --argjson conds "$NEW_CONDITIONS" \
          '[.[] | select(.script == $script and .conditions == $conds)] | length' \
          manifest.json)

        if [[ "$DUPLICATE" -gt 0 ]]; then
          echo "ERROR: An entry for '${{ github.event.inputs.scriptName }}' with these exact conditions already exists in the manifest."
          exit 1
        fi

  addEntry:
    name: Add new entry to manifest
    needs: parseManifest
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3


    - name: Create new entry
      id: new_entry
      env:
        DB_PATTERN: ${{ github.event.inputs.db_pattern }}
        VERSION_PATTERN: ${{ github.event.inputs.version_pattern }}
        SCRIPT_NAME: ${{ github.event.inputs.scriptName }}
      run: |
        DB_ARRAY=$(echo "$DB_PATTERN" | jq -R 'split(",")')

        if [[ -n "$VERSION_PATTERN" ]]; then
          VERSION_ARRAY=$(echo "$VERSION_PATTERN" | jq -R 'split(",")')
          NEW_CONDITIONS=$(jq -n --argjson db "$DB_ARRAY" --argjson vp "$VERSION_ARRAY" \
            '[{"field": "DBName", "pattern": $db}, {"field": "Version", "pattern": $vp}]')
        else
          NEW_CONDITIONS=$(jq -n --argjson db "$DB_ARRAY" \
            '[{"field": "DBName", "pattern": $db}]')
        fi

        jq --arg script "$SCRIPT_NAME" \
           --argjson conds "$NEW_CONDITIONS" \
           '. += [{
             "script": $script,
             "operator": "AND",
             "conditions": $conds
           }]' manifest.json > tmp.json && mv tmp.json manifest.json

    - name: Format manifest as compact style
      run: |
        python3 << 'EOF'
        import json

        with open("manifest.json", "r") as f:
            data = json.load(f)

        lines = ["["]
        for i, entry in enumerate(data):
            comma = "," if i < len(data) - 1 else ""
            lines.append("    {")
            # script
            lines.append(f'        "script": {json.dumps(entry["script"])},')
            # operator
            lines.append(f'        "operator": {json.dumps(entry["operator"])},')
            # conditions - each on one line
            lines.append('        "conditions": [')
            conditions = entry["conditions"]
            for j, cond in enumerate(conditions):
                cond_comma = "," if j < len(conditions) - 1 else ""
                cond_str = json.dumps(cond, separators=(", ", ": "))
                lines.append(f"            {cond_str}{cond_comma}")
            lines.append("        ],")
            # description (optional)
            if "description" in entry:
                lines.append(f'        "description": {json.dumps(entry["description"])},')
            # verify (optional)
            if "verify" in entry:
                lines.append(f'        "verify": {json.dumps(entry["verify"])},')
            # Remove trailing comma from last field
            lines[-1] = lines[-1].rstrip(",")
            lines.append(f"    }}{comma}")
        lines.append("]")
        lines.append("")

        with open("manifest.json", "w") as f:
            f.write("\n".join(lines))

        print("Formatted manifest.json in compact style")
        EOF

        echo "Formatted manifest.json:"
        cat manifest.json

    - name: Validate manifest.json is valid JSON
      run: |
        echo "Validating manifest.json syntax..."
        if jq empty manifest.json 2>&1; then
          echo "✅ manifest.json is valid JSON"
        else
          echo "❌ manifest.json has invalid JSON syntax"
          exit 1
        fi

    - name: Validate manifest structure
      run: |
        echo "Checking manifest structure..."
        ERRORS=0

        # Check it's an array
        TYPE=$(jq -r 'type' manifest.json)
        if [[ "$TYPE" != "array" ]]; then
          echo "❌ Expected top-level array, got: $TYPE"
          ERRORS=$((ERRORS + 1))
        fi

        # Check each entry has required fields
        ENTRY_COUNT=$(jq 'length' manifest.json)
        for i in $(seq 0 $((ENTRY_COUNT - 1))); do
          SCRIPT=$(jq -r ".[$i].script // empty" manifest.json)
          OPERATOR=$(jq -r ".[$i].operator // empty" manifest.json)
          CONDITIONS=$(jq -r ".[$i].conditions // empty" manifest.json)

          if [[ -z "$SCRIPT" ]]; then
            echo "❌ Entry $i: missing 'script' field"
            ERRORS=$((ERRORS + 1))
          fi
          if [[ -z "$OPERATOR" ]]; then
            echo "❌ Entry $i: missing 'operator' field"
            ERRORS=$((ERRORS + 1))
          fi
          if [[ -z "$CONDITIONS" ]]; then
            echo "❌ Entry $i: missing 'conditions' field"
            ERRORS=$((ERRORS + 1))
          fi

          # Check that all pattern fields are arrays
          PATTERN_TYPES=$(jq -r ".[$i].conditions[]?.pattern | type" manifest.json 2>/dev/null)
          for ptype in $PATTERN_TYPES; do
            if [[ "$ptype" != "array" ]]; then
              echo "❌ Entry $i: 'pattern' field must be an array, got: $ptype"
              ERRORS=$((ERRORS + 1))
            fi
          done
        done

        if [[ $ERRORS -gt 0 ]]; then
          echo "❌ Validation failed with $ERRORS error(s)"
          exit 1
        fi
        echo "✅ All $ENTRY_COUNT entries are structurally valid"

    - name: Commit changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add manifest.json
        git commit -m "manifest: add entry for ${{ github.event.inputs.scriptName }}"
        git push origin HEAD:main
